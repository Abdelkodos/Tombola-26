<script src="db.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', renderHistory);

  function renderHistory() {
    const container = document.getElementById('historyContainer');
    const winners   = DB.getWinners();

    if (!winners.length) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon"><i class="ti ti-trophy"></i></div>
          <p>Aucun gagnant pour l'instant.<br>Rendez-vous sur la page Tirage pour lancer votre premier tirage.</p>
        </div>`;
      return;
    }

    const rows = winners.slice().reverse().map((w, i) => {
      const rank = winners.length - i;
      return `
        <tr>
          <td class="rank-cell">#${rank}</td>
          <td class="name-cell">${escHtml(w.name)}</td>
          <td class="date-cell">${w.date} à ${w.time}</td>
          <td class="action-cell">
            <button class="del-btn" onclick="deleteWinner(${w.id})" title="Supprimer">
              <i class="ti ti-x"></i>
            </button>
          </td>
        </tr>`;
    }).join('');

    container.innerHTML = `
      <table class="history-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Date &amp; Heure</th>
            <th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function deleteWinner(id) {
    if (!confirm('Supprimer ce gagnant de l\'historique ?')) return;
    DB.deleteWinner(id);
    renderHistory();
  }

  function clearAll() {
    if (!confirm('Effacer tout l\'historique ? Cette action est irréversible.')) return;
    DB.clearWinners();
    renderHistory();
  }

  function exportCSV() {
    const winners = DB.getWinners();
    if (!winners.length) { alert('Aucun historique à exporter.'); return; }
    const header = 'Rang,Nom,Date,Heure';
    const rows   = winners.map((w, i) =>
      `${i+1},"${w.name}","${w.date}","${w.time}"`
    ).join('\n');
    const blob = new Blob([`${header}\n${rows}`], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = 'abrar-historique-tirage.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
